<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daddy Roofer — Toiture & Construction Montréal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f5;
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ✅ DESKTOP MODE OVERRIDE */
  body.desktop {
    max-width: 1100px;
    padding: 30px;
  }

  body.desktop .dr-card {
    max-width: 900px;
    margin: 0 auto;
  }

  body.desktop .dr-tabs {
    max-width: 600px;
    margin: 0 auto 1rem;
  }

  input, select, textarea, button {
    font-family: inherit;
    border-radius: 8px;
    border: 1px solid #ddd;
    padding: 10px 12px;
    outline: none;
  }

  input:focus, select:focus, textarea:focus { border-color: #c0392b; }

  .dr-hero { background: #0d1b2a; border-radius: 12px; margin-bottom: 1rem; overflow: hidden; }
  .dr-hero-top { background: #fff; padding: 1rem 1.5rem 0.75rem; display: flex; align-items: center; justify-content: center; }
  .dr-logo-flat { width: 170px; object-fit: contain; display: block; }
  .dr-hero-bottom { padding: 8px 1.5rem 12px; text-align: center; }
  .dr-hero-bottom p { color: #b0bec5; font-size: 10px; line-height: 1.5; }
  .dr-hero-bottom .rbq { color: #c0392b; font-size: 10px; margin-top: 2px; }

  .contact-bar-top { background: #c0392b; border-radius: 8px; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-bottom: 1rem; }
  .contact-bar-top a { color: #fff; font-size: 11px; font-weight: 500; display: flex; align-items: center; gap: 4px; text-decoration: none; }
  .contact-bar-top a i { font-size: 13px; }
  .contact-bar-top .cb-sep { color: rgba(255,255,255,0.4); font-size: 14px; }

  .trust-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 1rem; }
  .trust-item { background: #0d1b2a; border-radius: 8px; padding: 8px 4px; text-align: center; }
  .trust-item i { font-size: 15px; color: #c0392b; display: block; margin-bottom: 3px; }
  .trust-item span { font-size: 9px; color: #b0bec5; line-height: 1.4; display: block; }

  .dr-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 1rem; }
  .dr-tab { padding: 10px 6px; border-radius: 8px; border: 2px solid transparent; background: #fff; cursor: pointer; text-align: center; transition: all 0.15s; }
  .dr-tab.active { border-color: #c0392b; background: #fff; }
  .dr-tab i { font-size: 18px; color: #c0392b; display: block; margin-bottom: 3px; }
  .dr-tab .tab-main { font-size: 12px; font-weight: 500; color: #1a1a1a; display: block; }
  .dr-tab .tab-sub { font-size: 9px; color: #666; line-height: 1.4; display: block; margin-top: 2px; }

  .dr-section { display: none; }
  .dr-section.active { display: block; }

  .dr-card { background: #fff; border: 0.5px solid #e0e0e0; border-radius: 12px; padding: 1.25rem; }

  .pain-headline { background: linear-gradient(135deg, #0d1b2a, #1a2e45); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; border-left: 4px solid #c0392b; }
  .pain-headline h3 { color: #fff; font-size: 15px; font-weight: 500; line-height: 1.3; margin-bottom: 4px; }
  .pain-headline p { color: #b0bec5; font-size: 10px; line-height: 1.5; }

  .urgency-strip { background: #27ae60; border-radius: 8px; padding: 7px 12px; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 1rem; }
  .urgency-strip i { font-size: 13px; color: #fff; }
  .urgency-strip span { font-size: 11px; color: #fff; font-weight: 500; }

  .wa-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: #25D366; color: #fff; border: none; border-radius: 8px; padding: 11px; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; width: 100%; margin-bottom: 0.75rem; }
  .wa-btn i { font-size: 18px; }

  .form-heading { margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 3px solid #c0392b; }
  .form-heading h2 { font-size: 16px; font-weight: 500; color: #1a1a1a; margin-bottom: 2px; }

  .form-group { margin-bottom: 0.75rem; }
  .form-group label { display: block; font-size: 11px; font-weight: 500; color: #1a1a1a; margin-bottom: 4px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  .opt-item {
    border: 0.5px solid #ddd;
    border-radius: 8px;
    padding: 8px;
    cursor: pointer;
    display: flex;
    gap: 6px;
    background: #fff;
  }

  .opt-item:has(input:checked) { border-color: #c0392b; background: #fff5f5; }

  .dr-submit {
    width: 100%;
    padding: 12px;
    background: #c0392b;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }

  .privacy-note { font-size: 10px; color: #888; text-align: center; margin-top: 8px; }

  .success-wrap { display: none; text-align: center; padding: 2rem 1rem; }
  .success-wrap i { font-size: 44px; color: #27ae60; display: block; margin-bottom: 10px; }

</style>
</head>

<body class="mobile">

<div class="dr-hero">
  <div class="dr-hero-top">
    <img src="logo.png" class="dr-logo-flat" onerror="this.style.display='none'"/>
  </div>
  <div class="dr-hero-bottom">
    <p>Licensed & Insured · Montréal et environs</p>
    <p class="rbq">RBQ: 5876-6171-01</p>
  </div>
</div>

<div class="contact-bar-top">
  <a href="tel:5144478028">📞 514-447-8028</a>
  <a href="mailto:contact@daddyroofer.com">✉️ contact@daddyroofer.com</a>
</div>

<div class="dr-tabs">
  <div class="dr-tab active" onclick="showTab('estimate')">Estimate</div>
  <div class="dr-tab" onclick="showTab('careers')">Careers</div>
</div>

<div id="estimate-section" class="dr-section active">
  <div class="dr-card">
    <form id="estimate-form" action="https://formspree.io/f/mqeoybay" method="POST">
      <div class="form-group">
        <label>Full Name</label>
        <input name="Full Name" required/>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input name="Email" type="email" required/>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input name="Phone" required/>
        </div>
      </div>

      <button class="dr-submit" type="submit">Submit</button>
    </form>

    <div class="success-wrap" id="est-success">
      <i class="ti ti-circle-check"></i>
      <h3>Thank you!</h3>
    </div>
  </div>
</div>

<div id="careers-section" class="dr-section">
  <div class="dr-card">
    <form id="careers-form" action="https://formspree.io/f/xvznwerw" method="POST">
      <div class="form-group">
        <label>Full Name</label>
        <input name="Full Name" required/>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input name="Email" type="email" required/>
      </div>

      <button class="dr-submit" type="submit">Apply</button>
    </form>

    <div class="success-wrap" id="car-success">
      <i class="ti ti-circle-check"></i>
      <h3>Thank you!</h3>
    </div>
  </div>
</div>

<script>
function showTab(tab) {
  document.querySelectorAll('.dr-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.dr-section').forEach(s => s.classList.remove('active'));

  if (tab === 'estimate') {
    document.querySelectorAll('.dr-tab')[0].classList.add('active');
    document.getElementById('estimate-section').classList.add('active');
  } else {
    document.querySelectorAll('.dr-tab')[1].classList.add('active');
    document.getElementById('careers-section').classList.add('active');
  }
}

async function handleForm(e, formId, successId) {
  e.preventDefault();
  const form = document.getElementById(formId);

  const res = await fetch(form.action, {
    method: 'POST',
    body: new FormData(form),
    headers: { 'Accept': 'application/json' }
  });

  if (res.ok) {
    form.style.display = 'none';
    document.getElementById(successId).style.display = 'block';
  }
}

/* FORM HANDLERS */
document.getElementById('estimate-form').addEventListener('submit', (e) =>
  handleForm(e, 'estimate-form', 'est-success'));

document.getElementById('careers-form').addEventListener('submit', (e) =>
  handleForm(e, 'careers-form', 'car-success'));

/* ✅ DEVICE DETECTION */
function setDeviceMode() {
  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
    || window.innerWidth < 768;

  document.body.classList.remove('mobile', 'desktop');
  document.body.classList.add(isMobile ? 'mobile' : 'desktop');
}

setDeviceMode();
window.addEventListener('resize', setDeviceMode);
</script>

</body>
</html>
