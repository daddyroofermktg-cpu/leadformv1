  .footer-fb i { font-size: 16px; color: #fff; }

</style>

<script>
function showTab(tab) {
  document.querySelectorAll('.dr-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.dr-section').forEach(s => s.classList.remove('active'));
  if (tab === 'estimate') {
    document.querySelectorAll('.dr-tab')[0].classList.add('active');
    document.getElementById('estimate-section').classList.add('active');
  } else {
    document.querySelectorAll('.dr-tab')[1].classList.add('active');
    document.getElementById('careers-section').classList.add('active');
  }
}

async function handleForm(e, formId, btnId, wrapId, successId, errorId) {
  e.preventDefault();
  const form = document.getElementById(formId);
  const btn = document.getElementById(btnId);
  const error = document.getElementById(errorId);
  btn.classList.add('submitting');
  btn.innerHTML = '<i class="ti ti-loader"></i> Sending...';
  error.style.display = 'none';

  try {
    const data = new FormData(form);
    const res = await fetch(form.action, {
      method: 'POST',
      body: data,
      headers: { 'Accept': 'application/json' }
    });

    if (res.ok) {
      document.getElementById(wrapId).style.display = 'none';
      document.getElementById(successId).style.display = 'block';
    } else {
      throw new Error('Server error');
    }
  } catch (err) {
    btn.classList.remove('submitting');
    btn.innerHTML = '<i class="ti ti-send"></i> Submit / Soumettre / Enviar';
    error.style.display = 'block';
  }
}

document.getElementById('estimate-form').addEventListener('submit', (e) =>
  handleForm(e, 'estimate-form', 'est-btn', 'est-form-wrap', 'est-success', 'est-error'));

document.getElementById('careers-form').addEventListener('submit', (e) =>
  handleForm(e, 'careers-form', 'car-btn', 'car-form-wrap', 'car-success', 'car-error'));
</script>
