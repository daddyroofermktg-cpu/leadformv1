<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daddy Roofer — Toiture & Construction Montréal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 16px; max-width: 480px; margin: 0 auto; }
  input, select, textarea, button { font-family: inherit; border-radius: 8px; border: 1px solid #ddd; padding: 10px 12px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: #c0392b; }
  .dr-hero { background: #0d1b2a; border-radius: 12px; margin-bottom: 1rem; overflow: hidden; }
  .dr-hero-top { background: #fff; padding: 1rem 1.5rem 0.75rem; display: flex; align-items: center; justify-content: center; }
  .dr-logo-flat { width: 170px; object-fit: contain; display: block; }
  .dr-hero-bottom { padding: 8px 1.5rem 12px; text-align: center; }
  .dr-hero-bottom p { color: #b0bec5; font-size: 10px; line-height: 1.5; }
  .dr-hero-bottom .rbq { color: #c0392b; font-size: 10px; margin-top: 2px; }
  .contact-bar-top { background: #c0392b; border-radius: 8px; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-bottom: 1rem; }
  .contact-bar-top a { color: #fff; font-size: 11px; font-weight: 500; display: flex; align-items: center; gap: 4px; text-decoration: none; }
  .contact-bar-top a i { font-size: 13px; }
  .contact-bar-top .cb-sep { color: rgba(255,255,255,0.4); font-size: 14px; }
  .trust-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 1rem; }
  .trust-item { background: #0d1b2a; border-radius: 8px; padding: 8px 4px; text-align: center; }
  .trust-item i { font-size: 15px; color: #c0392b; display: block; margin-bottom: 3px; }
  .trust-item span { font-size: 9px; color: #b0bec5; line-height: 1.4; display: block; }
  .dr-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 1rem; }
  .dr-tab { padding: 10px 6px; border-radius: 8px; border: 2px solid transparent; background: #fff; cursor: pointer; text-align: center; transition: all 0.15s; }
  .dr-tab.active { border-color: #c0392b; background: #fff; }
  .dr-tab i { font-size: 18px; color: #c0392b; display: block; margin-bottom: 3px; }
  .dr-tab .tab-main { font-size: 12px; font-weight: 500; color: #1a1a1a; display: block; }
  .dr-tab .tab-sub { font-size: 9px; color: #666; line-height: 1.4; display: block; margin-top: 2px; }
  .dr-section { display: none; }
  .dr-section.active { display: block; }
  .dr-card { background: #fff; border: 0.5px solid #e0e0e0; border-radius: 12px; padding: 1.25rem; }
  .pain-headline { background: linear-gradient(135deg, #0d1b2a, #1a2e45); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; border-left: 4px solid #c0392b; }
  .pain-headline h3 { color: #fff; font-size: 15px; font-weight: 500; line-height: 1.3; margin-bottom: 4px; }
  .pain-headline p { color: #b0bec5; font-size: 10px; line-height: 1.5; }
  .pain-headline .pain-fr { color: #c0392b; font-size: 10px; font-style: italic; margin-top: 4px; }
  .urgency-strip { background: #27ae60; border-radius: 8px; padding: 7px 12px; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 1rem; }
  .urgency-strip i { font-size: 13px; color: #fff; }
  .urgency-strip span { font-size: 11px; color: #fff; font-weight: 500; }
  .wa-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: #25D366; color: #fff; border: none; border-radius: 8px; padding: 11px; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; width: 100%; margin-bottom: 0.75rem; transition: background 0.15s; }
  .wa-btn:hover { background: #1ebe5a; }
  .wa-btn i { font-size: 18px; }
  .wa-divider { display: flex; align-items: center; gap: 8px; margin-bottom: 0.75rem; }
  .wa-divider span { font-size: 10px; color: #888; white-space: nowrap; }
  .wa-divider::before, .wa-divider::after { content: ''; flex: 1; height: 0.5px; background: #e0e0e0; }
  .form-heading { margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 3px solid #c0392b; }
  .form-heading h2 { font-size: 16px; font-weight: 500; color: #1a1a1a; margin-bottom: 2px; }
  .form-heading p { font-size: 11px; color: #666; line-height: 1.4; }

  .req { color: #c0392b; margin-left: 1px; }
  .form-group { margin-bottom: 0.75rem; }

  .form-group input, .form-group select { width: 100%; font-size: 13px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .opt-item { border: 0.5px solid #ddd; border-radius: 8px; padding: 8px; cursor: pointer; display: flex; align-items: flex-start; gap: 6px; background: #fff; transition: border-color 0.15s, background 0.15s; }
  .opt-item:has(input:checked) { border-color: #c0392b; background: #fff5f5; }
  .opt-item input[type="radio"], .opt-item input[type="checkbox"] { width: auto; margin-top: 2px; flex-shrink: 0; accent-color: #c0392b; padding: 0; border: none; }
  .opt-label { font-size: 11px; line-height: 1.4; color: #1a1a1a; }
  .wa-photo-prompt { background: #f0fdf4; border: 1px solid #25D366; border-radius: 8px; padding: 10px 12px; display: flex; align-items: flex-start; gap: 10px; margin-bottom: 0.75rem; }
  .wa-photo-prompt i { font-size: 20px; color: #25D366; flex-shrink: 0; margin-top: 1px; }
  .wa-photo-prompt-text { font-size: 11px; color: #166534; line-height: 1.5; }
  .wa-photo-prompt-text strong { display: block; font-size: 12px; margin-bottom: 2px; }
  .wa-photo-prompt-text a { color: #25D366; font-weight: 500; text-decoration: none; }
  .next-steps { background: #f9f9f9; border-radius: 8px; padding: 0.875rem; margin-bottom: 0.875rem; border: 0.5px solid #27ae60; }

  .next-step { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }

  .step-num { background: #c0392b; color: #fff; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; flex-shrink: 0; margin-top: 1px; }
  .step-text { font-size: 11px; color: #1a1a1a; line-height: 1.4; }
  .step-text small { color: #666; font-size: 10px; display: block; font-style: italic; }
  .rbq-badge { display: flex; align-items: center; gap: 8px; border: 0.5px solid #ddd; border-radius: 8px; padding: 8px 10px; margin-bottom: 0.75rem; background: #f9f9f9; }
  .rbq-badge i { font-size: 16px; color: #c0392b; }
  .rbq-badge span { font-size: 11px; font-weight: 500; color: #1a1a1a; }
  .rbq-num { color: #c0392b; }
  .dr-submit { width: 100%; padding: 12px; background: #c0392b; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s; }
  .dr-submit:hover { background: #a93226; }
  .dr-submit .sep { color: rgba(255,255,255,0.55); }
  .privacy-note { font-size: 10px; color: #888; text-align: center; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .footer-bar { background: #0d1b2a; border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; margin-top: 1rem; }
  .footer-bar-text { font-size: 9px; color: #b0bec5; line-height: 1.5; }
  .footer-fb { display: flex; align-items: center; gap: 6px; text-decoration: none; background: #1877F2; border-radius: 6px; padding: 5px 10px; flex-shrink: 0; border: none; }
  .footer-fb i { font-size: 16px; color: #fff; }
  .footer-fb span { font-size: 10px; color: #fff; font-weight: 500; white-space: nowrap; }
  .hiring-banner { background: #0d1b2a; border-radius: 8px; padding: 0.875rem 1.25rem; margin-bottom: 0.875rem; }
  .hiring-banner h3 { color: #fff; font-size: 13px; font-weight: 500; margin-bottom: 2px; }
  .hiring-banner p { color: #c0392b; font-size: 11px; font-style: italic; line-height: 1.4; }
  .badge-imm { display: inline-flex; align-items: center; gap: 6px; background: #c0392b; color: #fff; border-radius: 8px; padding: 5px 10px; font-size: 11px; font-weight: 500; margin-bottom: 0.875rem; }
  .badge-imm i { font-size: 13px; }
  .info-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 0.875rem; }
  .info-block { background: #f9f9f9; border-radius: 8px; padding: 0.75rem; margin-bottom: 0.75rem; }
  .info-block-title { font-size: 10px; font-weight: 500; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
  .info-block-title i { font-size: 12px; color: #c0392b; }
  .info-list { list-style: none; }
  .info-list li { font-size: 11px; color: #1a1a1a; padding: 2px 0; display: flex; align-items: flex-start; gap: 5px; line-height: 1.4; }
  .info-list li i { font-size: 12px; color: #c0392b; margin-top: 1px; flex-shrink: 0; }
  .asp-badge { border: 0.5px solid #ddd; border-radius: 8px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; margin-bottom: 0.75rem; }
  .asp-badge i { font-size: 16px; color: #c0392b; }
  .asp-badge span { font-size: 11px; font-weight: 500; color: #1a1a1a; }
  .contact-bar { background: #0d1b2a; border-radius: 8px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-bottom: 0.75rem; }
  .contact-bar a { color: #fff; font-size: 10px; display: flex; align-items: center; gap: 4px; text-decoration: none; }
  .contact-bar a i { font-size: 12px; color: #c0392b; }
  .divider { height: 0.5px; background: #e0e0e0; margin: 0.875rem 0; }
  .success-wrap { display: none; text-align: center; padding: 2rem 1rem; }
  .success-wrap i { font-size: 44px; color: #27ae60; display: block; margin-bottom: 10px; }
  .success-wrap h3 { font-size: 16px; font-weight: 500; color: #1a1a1a; margin-bottom: 6px; }
  .success-wrap p { font-size: 12px; color: #666; line-height: 1.7; }
  .error-msg { color: #c0392b; font-size: 11px; margin-top: 6px; display: none; }
  .submitting { opacity: 0.7; pointer-events: none; }

  /* ✅ ONLY ADDITION: DESKTOP LAYOUT UPGRADE */
  @media (min-width: 900px) {
    body {
      max-width: 1200px;
      padding: 30px;
    }

    .dr-card {
      padding: 2rem;
    }

    .dr-tabs {
      grid-template-columns: 1fr 1fr;
      max-width: 500px;
      margin: 0 auto 1.5rem;
    }

    .trust-bar {
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      gap: 12px;
    }

    .form-row {
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .dr-hero-bottom p {
      font-size: 12px;
    }

    .form-heading h2 {
      font-size: 20px;
    }

    .wa-btn {
      font-size: 14px;
    }

    .footer-bar {
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
  }
</style>
